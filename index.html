<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K8s of Empires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <div id="scene"></div>

    <header id="clusterCard" class="cluster-card glass-card">
      <div class="cluster-summary">
        <div class="k8s-logo">☸</div>
        <div class="cluster-heading">
          <h1>K8s of Empires</h1>
          <p>Kubernetes Cluster Explorer</p>
        </div>
        <div class="cluster-actions">
          <button id="clusterRefresh" class="cluster-action cluster-refresh" type="button" aria-label="Refresh cluster" title="Refresh cluster">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/>
              <path d="M3 21v-5h5"/>
              <path d="M3 12A9 9 0 0 1 18.4 5.6L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
          </button>
          <button id="clusterToggle" class="cluster-action cluster-toggle" type="button" aria-expanded="false" aria-controls="clusterDetails" aria-label="Show cluster information" title="Show cluster information">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div id="clusterDetails" class="cluster-details">
        <div class="cluster-details-inner">
          <div class="cluster-explorer-heading">
            <span>Cluster resources</span>
            <small id="lastRefreshed" aria-live="polite">Updated just now</small>
          </div>
          <div class="cluster-label-filter">
            <label for="clusterLabelInput">Filtrar pods por labels</label>
            <div class="cluster-label-controls">
              <input id="clusterLabelInput" type="search" placeholder="Search: tier=frontend" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="clusterLabelSuggestions" />
              <button id="addClusterLabel" type="button">Add</button>
            </div>
            <div id="clusterLabelSuggestions" class="cluster-label-suggestions" role="listbox" hidden></div>
            <div id="clusterLabelHelp" class="cluster-label-help">Selectors are combined using AND logic.</div>
            <div id="activeClusterLabels" class="active-cluster-labels"></div>
          </div>
          <div id="clusterExplorer" class="cluster-explorer"></div>
        </div>
      </div>
    </header>

    <aside class="namespace-card glass-card">
      <h2>Namespaces</h2>
      <div id="namespaceLegend" class="namespace-list"></div>
      <div class="filter-divider"></div>
      <h2>Pod status</h2>
      <div id="podStatusFilters" class="status-filters"></div>
    </aside>

    <section id="infoPanel" class="info-panel glass-card">
      <button id="closeInfo" aria-label="Close">×</button>
      <div class="eyebrow" id="infoKind">Resource</div>
      <h2 id="infoTitle">Select a resource</h2>
      <div id="infoRows"></div>
    </section>

    <footer class="stats-bar glass-card">
      <article><span class="stat-icon">⬡</span><div><small>Pods</small><strong id="statPods">0</strong></div></article>
      <article><span class="stat-icon">▦</span><div><small>Nodes</small><strong id="statNodes">3</strong></div></article>
      <article><span class="stat-icon">◫</span><div><small>Namespaces</small><strong id="statNamespaces">0</strong></div></article>
      <article><span class="stat-icon">◈</span><div><small>Deployments</small><strong id="statDeployments">0</strong></div></article>
      <article>
        <span id="statStatusIcon" class="stat-icon status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
        </span>
        <div><small>Status</small><strong id="statStatus" class="status-text">Healthy</strong></div>
      </article>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app/config.js"></script>
  <script src="app/data.js"></script>
  <script src="app/scene.js"></script>
  <script src="app/graphics.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/world.js"></script>
  <script src="app/controls.js"></script>
  <script src="app/main.js"></script>

</body>
</html>
